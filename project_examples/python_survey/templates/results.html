<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Survey App</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><h1>Your answers</h1><dl>{% for question, answer in results %}<dt>{{ question }}</dt><dd>{{ answer }}</dd>{% endfor %}</dl>
<a class="button" href="{{ url_for('index') }}">← Back to Survey</a><form method="post" action="{{ url_for('restart') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>New random survey</button></form></main></body></html>
