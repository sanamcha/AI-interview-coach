<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calculator App</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><h1>Basic calculator</h1><form id="calculator"><label for="left">First number</label><input id="left" name="left" type="number" step="any" required>
<label for="operation">Operation</label><select id="operation" name="operation"><option value="add">+ Addition</option><option value="subtract">− Subtraction</option><option value="multiply">× Multiplication</option><option value="divide">÷ Division</option></select>
<label for="right">Second number</label><input id="right" name="right" type="number" step="any" required><button>Calculate</button><button type="reset">Clear</button></form><p id="result" class="result" role="status">Enter two numbers to begin.</p><p>Supports decimals and negative numbers. Results are rounded to 12 significant digits.</p></main></body></html>
