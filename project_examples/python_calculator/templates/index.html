<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calculator App</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><h1>Basic calculator</h1><form method="get" action="{{ url_for('index') }}"><label for="left">First number</label><input id="left" name="left" value="{{ left }}" type="number" step="any" required>
<label for="operation">Operation</label><select id="operation" name="operation"><option value="add" {% if operation == "add" %}selected{% endif %}>+ Addition</option><option value="subtract" {% if operation == "subtract" %}selected{% endif %}>− Subtraction</option><option value="multiply" {% if operation == "multiply" %}selected{% endif %}>× Multiplication</option><option value="divide" {% if operation == "divide" %}selected{% endif %}>÷ Division</option></select>
<label for="right">Second number</label><input id="right" name="right" value="{{ right }}" type="number" step="any" required><button>Calculate</button><a class="button" href="{{ url_for('index') }}">Clear</a></form><p class="result" role="status">{{ result }}</p><p>Supports decimals and negative numbers. Results are rounded to 12 significant digits.</p></main></body></html>
