<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>5-Star Ratings</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><h1>5-Star Ratings</h1><p id="help">Choose a star to rate. Click the selected rating again to clear it. Use Tab and Enter or Space with a keyboard.</p>
<div class="stars" role="group" aria-label="Choose a rating" aria-describedby="help">
<button class="star" type="button" data-value="1" aria-label="Rate 1 out of 5" aria-pressed="false">★</button>
<button class="star" type="button" data-value="2" aria-label="Rate 2 out of 5" aria-pressed="false">★</button>
<button class="star" type="button" data-value="3" aria-label="Rate 3 out of 5" aria-pressed="false">★</button>
<button class="star" type="button" data-value="4" aria-label="Rate 4 out of 5" aria-pressed="false">★</button>
<button class="star" type="button" data-value="5" aria-label="Rate 5 out of 5" aria-pressed="false">★</button>
</div><p id="status" role="status">No rating selected.</p><p>Reloading clears this rating.</p></main></body></html>
