<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="chat-api" content="{{ url_for('messages') }}"><title>Chat App</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script src="{{ url_for('static',filename='app.js') }}" defer></script></head><body><main>
<h1>Shared-room chat</h1><p>Open this app in two tabs. Join the same room with different names. Demo names are not verified; anyone with the room name can join.</p>
<form id="join"><label>Your name <input name="name" maxlength="30" required></label><label>Room <input name="room" maxlength="40" value="practice" required></label><button>Join room</button></form>
<section id="chat" hidden><h2 id="room-title"></h2><button id="leave" type="button">Leave room</button><div id="messages" role="log" aria-label="Messages" aria-live="polite"></div><form id="send"><label>Message <input name="text" maxlength="500" required autocomplete="off"></label><button>Send</button></form></section><p id="status" role="status"></p></main></body></html>
