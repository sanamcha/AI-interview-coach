<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weather App</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><h1>Current weather</h1><form id="search"><label for="city">City name</label><input id="city" name="city" type="text" maxlength="100" required placeholder="e.g. London"><button>Search weather</button></form><p id="status" role="status"></p><section id="weather" class="weather" hidden></section><p>Showing the first matching city. Check its region and country.</p><p>Weather data: <a href="https://open-meteo.com/">Open-Meteo</a> · Locations: GeoNames. Current conditions are model estimates.</p></main></body></html>
