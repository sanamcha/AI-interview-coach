<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pagination</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><h1>Fruit pagination</h1><p>20 fruits · 5 items per page</p><ol id="items"></ol>
<nav class="pagination" aria-label="Fruit pages"><button id="previous" type="button" aria-label="Previous page" title="Previous page">←</button><p id="status" role="status"></p><button id="next" type="button" aria-label="Next page" title="Next page">→</button></nav></main></body></html>
